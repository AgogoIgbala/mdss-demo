let sp=0,sc=0;ST.forEach(s=>R[s.id].forEach((x,d)=>{if(x){sc++;if(LV[s.id+'|'+d]=='P'||s.off.includes(dow(d)))sp++}}));
S.st={req,fill,cells,v,ccr:(1-V/H)*100,rei,dep,it,pref:sc?100*(1-sp/sc):100}}
function push(m){S.log.unshift(new Date().toLocaleTimeString()+' – '+m);const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
const TABS={roster:'Roster',my:'My duties',swaps:'Shift swaps',metrics:'Evaluation',data:'Dataset'};
function go(t){if(t)S.tab=t;const adm=$('#role').value=='admin';if(!adm&&['metrics','data'].includes(S.tab))S.tab='roster';
$('#nav').innerHTML=Object.keys(TABS).filter(k=>adm||!['metrics','data'].includes(k)).map(k=>`<button class="${k==S.tab?'on':''}" onclick="go('${k}')">${TABS[k]}</button>`).join('');$('#v').innerHTML=({roster:vRoster,my:vMy,swaps:vSwaps,metrics:vMetrics,data:vData})[S.tab]()}
function chgDs(n){load(n);generate()}
const chip=x=>x?`<span class="chip ${x}" title="${SH[x].n}">${x}</span>`:'';
function vRoster(){if(!R)return'<div class="card">Press <b>Generate roster</b>.</div>';
const g=ST.filter(s=>(S.fd=='All'||s.dept==S.fd)&&(S.fr=='All'||s.rank==S.fr)),hd=[...Array(days).keys()].map(d=>`<th class="${wkd(d)?'we':''}">${dstr(d).slice(5)}<br>${'SMTWTFS'[dow(d)]}</th>`).join('');
return`<div class="row"><select onchange="S.fd=this.value;go()"><option>All</option>${DP.map(p=>`<option value="${p.id}" ${p.id==S.fd?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select onchange="S.fr=this.value;go()">${['All','Consultant','Resident','Intern','Senior Nurse','Junior Nurse'].map(k=>`<option ${k==S.fr?'selected':''}>${k}</option>`).join('')}</select><button class="btn g" onclick="csv()">Export CSV</button></div><div class="mu">M Morning · A Afternoon · N Night · C Call-Duty · <span class="L">L</span> approved leave · <span class="P">p</span> pending leave. ${g.length} staff shown.</div>
<div class="sc"><table><tr><th>Staff</th>${hd}</tr>${g.map(s=>`<tr><td>${esc(s.name)}<div class="mu">${s.rank} · ${s.dept}</div></td>${R[s.id].map((x,d)=>`<td class="${wkd(d)?'we':''}">${x?chip(x):LV[s.id+'|'+d]=='L'?'<span class="L">L</span>':LV[s.id+'|'+d]?'<span class="P">p</span>':''}</td>`).join('')}</tr>`).join('')}</table></div>`}
function csv(){const o='Staff,Department,Rank,'+[...Array(days).keys()].map(dstr).join(',')+'\n'+ST.map(s=>[s.name,s.dept,s.rank,...R[s.id].map(x=>x||'')].join(',')).join('\n'),a=document.createElement('a');a.href='data:text/csv,'+encodeURIComponent(o);a.download='roster_'+S.ds+'.csv';a.click()}
function vMy(){if(!R)return'<div class="card">Generate a roster first.</div>';const me=IDX[S.sel];
const rows=R[me.id].map((x,d)=>x?`<tr><td>${dstr(d)}</td><td>${chip(x)} ${SH[x].n}</td><td><select id="sw${d}">${ST.filter(b=>b.dept==me.dept&&b.g==me.g&&b.id!=me.id&&can(b,d,x)).slice(0,40).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')||'<option value="">no one eligible</option>'}</select> <button class="btn g" onclick="reqSwap('${me.id}',${d})">Request swap</button></td></tr>`:'').join('');
return`<div class="row"><select onchange="S.sel=this.value;go()">${ST.map(s=>`<option value="${s.id}" ${s.id==S.sel?'selected':''}>${esc(s.name)} (${s.rank}, ${s.dept})</option>`).join('')}</select></div><div class="sc"><table><tr><th>Date</th><th>Shift</th><th>Hand over to</th></tr>${rows||'<tr><td colspan=3>No duties this period.</td></tr>'}</table></div>`}
function reqSwap(id,d){const to=$('#sw'+d).value;if(!to)return push('No eligible colleague.');S.swaps.push({id,d,to,st:'Pending'});push('Swap requested: '+IDX[id].name+' → '+IDX[to].name);go('swaps')}
function vSwaps(){const adm=$('#role').value=='admin';return`<h2>Swap requests</h2><div class="sc"><table><tr><th>From</th><th>To</th><th>Date</th><th>Status</th><th></th></tr>${S.swaps.map((w,i)=>`<tr><td>${esc(IDX[w.id].name)}</td><td>${esc(IDX[w.to].name)}</td><td>${dstr(w.d)} ${chip(R[w.id][w.d])}</td><td>${w.st}</td><td>${adm&&w.st=='Pending'?`<button class="btn" onclick="decide(${i},1)">Approve</button> <button class="btn r" onclick="decide(${i},0)">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>No requests.</td></tr>'}</table></div><h2>Notification log</h2><div class="card mu">${S.log.map(esc).join('<br>')||'Nothing yet.'}</div>`}
function decide(i,ok){const w=S.swaps[i],sh=R[w.id][w.d];if(ok){R[w.id][w.d]=null;if(!can(IDX[w.to],w.d,sh)){R[w.id][w.d]=sh;w.st='Rejected (violates hard constraint)';push('Swap blocked by constraint checker.')}else{R[w.to][w.d]=sh;w.st='Approved';evalAll(S.st.it);push('Swap approved; alerts sent to both staff.')}}else{w.st='Rejected';push('Swap rejected.')}go()}
function vMetrics(){const e=S.st;if(!e)return'<div class="card">Generate a roster first.</div>';
return`<div class="grid"><div class="card"><div class="k ${e.ccr>99.99?'ok':'bad'}">${e.ccr.toFixed(2)}%</div>Constraint Compliance Rate<div class="mu">${e.v} personal-rule violations, ${e.req-e.fill} unfilled required slots</div></div><div class="card"><div class="k">${(100*e.fill/e.req).toFixed(1)}%</div>Coverage fill<div class="mu">${e.fill} of ${e.req} required slots staffed</div></div><div class="card"><div class="k">${e.ms} ms</div>Computational latency<div class="mu">${e.it} local-search moves tried</div></div><div class="card"><div class="k">${e.pref.toFixed(1)}%</div>Preferred days off honoured</div></div>
${S.scale&&S.f<1?`<div class="card">Quotas are scaled to ${(S.f*100).toFixed(0)}% of the dataset requirements, department by department and rank by rank, based on how many shifts each team can legally work. Untick <b>Scale quotas to staff</b> to test the full quotas.</div>`:''}${e.req>e.fill?`<div class="card">Some departments need more staff per day than this dataset supplies once weekly-shift and rest limits apply, so quotas cannot all be met. Unfilled slots are counted as hard violations.</div>`:''}
<h2>Roster Equity Index by rank</h2><div class="sc"><table><tr><th>Rank</th><th>Staff</th><th>REI</th></tr>${Object.keys(e.rei).map(k=>`<tr><td>${k}</td><td>${ST.filter(s=>s.rank==k).length}</td><td>${e.rei[k].toFixed(3)}</td></tr>`).join('')}</table></div>
<h2>Coverage by department</h2><div class="sc"><table><tr><th>Department</th><th>Required</th><th>Filled</th><th>%</th></tr>${DP.map(p=>`<tr><td>${esc(p.name)}</td><td>${e.dep[p.id].q}</td><td>${e.dep[p.id].f}</td><td>${(100*e.dep[p.id].f/e.dep[p.id].q).toFixed(0)}</td></tr>`).join('')}</table></div>`}
function vData(){const d=D[S.ds];return`<div class="card"><h2>${S.ds} dataset</h2>${ST.length} staff · ${DP.length} departments · ${d.leave.length} leave records · ${start} for ${days} days (${d.mode} priority).<div class="mu">Rank mix: C = consultant, R = resident or intern, N = nurse. Approved leave is a hard exclusion; pending leave, preferred days off and shift preferences are weighted soft penalties.</div></div>
<h2>Rules loaded</h2><div class="sc"><table><tr><th>Rule</th><th>Type</th><th>Value</th><th>Weight</th></tr>${d.rules.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${r[3]}</td></tr>`).join('')}</table></div>
<h2>Departments</h2><div class="sc"><table><tr><th>Name</th><th>Morning</th><th>Afternoon</th><th>Night</th><th>Call</th></tr>${DP.map(p=>`<tr><td>${esc(p.name)}</td>${ORDER.slice().sort().reverse().length&&['M','A','N','C'].map(k=>`<td>${NEED(p,k).map(x=>x.join(':')).join(' ')}</td>`).join('')}</tr>`).join('')}</table></div>`}
$('#ds').innerHTML=Object.keys(D).map(k=>`<option>${k}</option>`).join('');load('Medium');generate();
</script></body></html>
